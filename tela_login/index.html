<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="projeto tela de login">
    <meta name="keyword" content="tela de login, login, projeto">
    <meta name="author" content="João Haroldo">
    <link rel="shortcut icon" href="img/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;500;700;800&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <form>
            <h1>Login</h1>

            <div class="input">
                <input type="email" placeholder="Email" required>
                <img width="20" height="20" src="https://img.icons8.com/fluency-systems-regular/48/user--v1.png" alt="user--v1"/>
            </div>

            <div class="input">
                <input type="password" placeholder="Senha" required>
                <img width="20" height="20" src="https://img.icons8.com/fluency-systems-regular/48/password--v1.png" alt="password--v1"/>
                <a href="#">Esqueci minha senha</a>
            </div>

            <button type="submit" class="bt">Entrar</button>
            <p>Não tem conta? <a href="#">Clique aqui</a></p>
        </form>
    </div>
    
</body>
</html>
